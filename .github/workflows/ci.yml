name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx eslint smart-control/server.js simulator/server.js --max-warnings 50

  test-smart-control:
    name: Test Smart Control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: cd smart-control && npm ci && npm test

  test-simulator:
    name: Test Simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: cd simulator && npm ci && npm test

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Check smart-control starts
        run: cd smart-control && timeout 5 node -e "require('./server.js')" || true
        env:
          MQTT_URL: 'mqtt://localhost:1883'
      - name: Check simulator starts
        run: cd simulator && timeout 5 node -e "require('./server.js')" || true
