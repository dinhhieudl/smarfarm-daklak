global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'smartfarm-smart-control'
    static_configs:
      - targets: ['smart-control:3002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'smartfarm-mosquitto'
    static_configs:
      - targets: ['mosquitto:9001']
    scrape_interval: 30s

  - job_name: 'smartfarm-superset'
    static_configs:
      - targets: ['superset-app:8088']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'smartfarm-redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
