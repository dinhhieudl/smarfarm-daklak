# AS923 Region Configuration for ChirpStack v4

[[regions]]
  id = "as923"
  description = "AS923"
  common_name = "AS923"

  # Gateway configuration
  [regions.gateway]
    force_gws_private = false

    # Gateway backend configuration
    [regions.gateway.backend]
      enabled = "mqtt"

      [regions.gateway.backend.mqtt]
        # Topic prefix for this region
        topic_prefix = "as923"

        # Shared subscription name
        share_name = "chirpstack"

        # MQTT server
        server = "tcp://mosquitto:1883"

        # QoS level
        qos = 0

        # Clean session
        clean_session = false

  # Channel configuration
  [[regions.gateway.channels]]
    frequency = 923200000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 923400000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 923600000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 923800000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 924000000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 924200000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 924400000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 924600000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  # RX window configuration
  [regions.rx1]
    delay = 1
    frequency_offset = 0

  [regions.rx2]
    frequency = 923200000
    dr = 2
