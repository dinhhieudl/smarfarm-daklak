x-superset-image: &superset-image apache/superset:4.1.1
x-superset-volumes:
  &superset-volumes
  - ./config/superset_config.py:/app/pythonpath/superset_config.py
  - ./config/requirements-local.txt:/app/requirements-local.txt
  - superset_home:/app/superset_home

services:

  # ── Superset Metadata Database ──
  superset-db:
    image: postgres:16-alpine
    container_name: sf-superset-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD is required}
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Superset Cache (Redis) ──
  superset-redis:
    image: redis:7-alpine
    container_name: sf-superset-redis
    restart: unless-stopped
    volumes:
      - superset-redis-data:/data
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Superset Init (one-time setup) ──
  superset-init:
    image: *superset-image
    container_name: sf-superset-init
    command: ["/app/docker/docker-init.sh"]
    user: "root"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      DATABASE_DB: superset
      DATABASE_HOST: superset-db
      DATABASE_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD is required}
      DATABASE_USER: superset
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
      SUPERSET_LOAD_EXAMPLES: "false"
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    volumes: *superset-volumes
    healthcheck:
      disable: true

  # ── Superset Application ──
  superset-app:
    image: *superset-image
    container_name: sf-superset-app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    user: "root"
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      DATABASE_DB: superset
      DATABASE_HOST: superset-db
      DATABASE_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD is required}
      DATABASE_USER: superset
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
      SUPERSET_LOAD_EXAMPLES: "false"
      FLASK_DEBUG: "false"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Superset Celery Worker ──
  superset-worker:
    image: *superset-image
    container_name: sf-superset-worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    user: "root"
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      DATABASE_DB: superset
      DATABASE_HOST: superset-db
      DATABASE_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD is required}
      DATABASE_USER: superset
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Superset Celery Beat (scheduler) ──
  superset-worker-beat:
    image: *superset-image
    container_name: sf-superset-worker-beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    user: "root"
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      DATABASE_DB: superset
      DATABASE_HOST: superset-db
      DATABASE_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD is required}
      DATABASE_USER: superset
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    healthcheck:
      disable: true

volumes:
  superset_home:
  superset-db-data:
  superset-redis-data:
