# Mosquitto MQTT Broker Configuration for SmartFarm Cloud
# Receives data from ChirpStack / Edge Agents

# TCP listener (for edge agents)
listener 1883
protocol mqtt

# WebSocket listener (for web dashboards)
listener 9001
protocol websockets

# Authentication
# In production, use password_file or auth plugin
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true

# Message size (sensor batches can be large)
message_size_limit 1048576

# QoS
max_queued_messages 1000
