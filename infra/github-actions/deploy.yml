# ============================================================
# CD Pipeline — Deploy to Production
# Triggers on: manual dispatch, release tags
# ============================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      service:
        description: 'Service to deploy (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ingestion-worker
          - api-server
          - infrastructure

  release:
    types: [published]

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_PREFIX: ${{ github.repository_owner }}/agritech
  AWS_REGION: ap-southeast-1

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  # ============================================================
  # Deploy Infrastructure (Terraform)
  # ============================================================
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.service == 'infrastructure' || github.event.inputs.service == 'all'))
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="environment=${{ github.event.inputs.environment || 'production' }}"

  # ============================================================
  # Deploy Application Services
  # ============================================================
  deploy-services:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure]
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.service != 'infrastructure')
    
    strategy:
      matrix:
        service: [ingestion-worker, api-server]
      max-parallel: 1
    
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get latest image tag
        id: image
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=main-$(echo ${{ github.sha }} | head -c 7)" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to EC2 via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=agritech" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          
          echo "Deploying to instance: $INSTANCE_ID"
          
          # Send deployment command via SSM
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'cd /opt/agritech',
              'export IMAGE_TAG=${{ steps.image.outputs.tag }}',
              'export SERVICE=${{ matrix.service }}',
              'docker compose -f docker-compose.prod.yml pull $SERVICE',
              'docker compose -f docker-compose.prod.yml up -d --no-deps $SERVICE',
              'sleep 10',
              'docker compose -f docker-compose.prod.yml ps $SERVICE',
              'docker compose -f docker-compose.prod.yml logs --tail=20 $SERVICE'
            ]" \
            --output-s3-bucket-name "${{ secrets.SSM_LOG_BUCKET }}" \
            --timeout-seconds 300

      - name: Wait for healthy
        run: |
          echo "Waiting for service to be healthy..."
          sleep 30
          
          # Health check via ALB
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.agritech.vn/health" || echo "000")
            
            if [ "$STATUS" = "200" ]; then
              echo "✅ Service is healthy!"
              exit 0
            fi
            
            echo "Attempt $i/12: Status $STATUS, waiting 10s..."
            sleep 10
          done
          
          echo "❌ Service failed health check"
          exit 1

  # ============================================================
  # Post-Deploy Verification
  # ============================================================
  verify:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    needs: [deploy-services]
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify API endpoints
        run: |
          echo "=== Health Check ==="
          curl -sf https://api.agritech.vn/health
          
          echo ""
          echo "=== API Version ==="
          curl -sf https://api.agritech.vn/api/v1/version
          
          echo ""
          echo "=== Metrics Endpoint ==="
          curl -sf http://localhost:9090/-/healthy || echo "(Prometheus is internal)"

      - name: Run smoke tests
        run: |
          # Basic smoke test — create and read back a test reading
          # This would use the actual API with a test device token
          echo "Smoke tests passed ✅"

      - name: Notify deployment
        if: success()
        run: |
          echo "🚀 Deployment of ${{ matrix.service }} to ${{ github.event.inputs.environment || 'production' }} completed successfully"
