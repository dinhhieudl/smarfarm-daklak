## ============================================================
## EMQX Configuration — IoT MQTT Broker
## ============================================================

node {
  name = "emqx@127.0.0.1"
  cookie = "agritech_emqx_cookie_change_me"
  data_dir = "/opt/emqx/data"
}

## Listeners
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10000
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 10000
  ssl_options {
    certfile = "/opt/emqx/etc/certs/server.crt"
    keyfile = "/opt/emqx/etc/certs/server.key"
    cacertfile = "/opt/emqx/etc/certs/ca.crt"
    verify = verify_peer
    fail_if_no_peer_cert = true
    tls_versions = ["tlsv1.2", "tlsv1.3"]
  }
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 5000
  websocket.mqtt_path = "/mqtt"
}

## Authentication — Database-backed
## Devices authenticate with username/password stored in device_tokens table
authentication = [
  {
    mechanism = password_based
    backend = postgresql
    server = "timescaledb:5432"
    database = "agritech"
    username = "agritech_app"
    password = "${DB_PASSWORD}"
    query = "SELECT password_hash FROM device_auth WHERE username = ${username} LIMIT 1"
    password_hash_algorithm {
      name = bcrypt
    }
  }
]

## Authorization (ACL)
## Devices can only publish to their own topic
authorization {
  no_match = deny
  deny_action = disconnect

  sources = [
    {
      type = postgresql
      server = "timescaledb:5432"
      database = "agritech"
      username = "agritech_app"
      password = "${DB_PASSWORD}"
      query = "SELECT permission, topic FROM device_acl WHERE clientid = ${clientid}"
    }
  ]
}

## MQTT Settings
mqtt {
  max_packet_size = 1MB
  max_clientid_len = 128
  max_topic_levels = 10
  max_qos_allowed = 1
  max_topic_alias = 65535
}

## System Topics (for monitoring)
sys_topics {
  sys_msg_interval = 1m
  sys_heartbeat_interval = 30s
}

## Dashboard
dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
}

## Logging
log {
  console {
    enable = true
    level = warning
  }
  file {
    enable = true
    level = warning
    path = "/opt/emqx/log/emqx.log"
    rotation_count = 5
    rotation_size = 50MB
  }
}
