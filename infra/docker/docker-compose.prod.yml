# ============================================================
# IoT AgriTech Platform — Production Docker Compose
# Deploy on EC2 instance(s) via CI/CD
# ============================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f
# ============================================================

version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # EMQX — MQTT Broker
  # ============================================================
  emqx:
    image: emqx/emqx:5.5.1
    container_name: agritech-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT
      - "8883:8883"     # MQTT over TLS
      - "8083:8083"     # MQTT over WebSocket
      - "8084:8084"     # MQTT over WebSocket TLS
      - "18083:18083"   # EMQX Dashboard (internal only)
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./certs:/opt/emqx/etc/certs:ro
    environment:
      EMQX_NAME: agritech-mqtt
      EMQX_HOST: ${MQTT_HOST:-0.0.0.0}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_ADMIN_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_ADMIN_PASSWORD}
      EMQX_ALLOW_ANONYMOUS: "false"
      EMQX_ACL_NOMATCH: deny
    networks:
      - agritech-net
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ============================================================
  # Go Ingestion Worker
  # ============================================================
  ingestion-worker:
    image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_WORKER}:${IMAGE_TAG:-latest}
    container_name: agritech-ingestion-worker
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      emqx:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-agritech}
      DB_USER: ${DB_USER:-agritech_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: require
      DB_MAX_CONNECTIONS: "20"
      DB_MAX_IDLE_CONNECTIONS: "5"
      
      # MQTT
      MQTT_BROKER: emqx:1883
      MQTT_CLIENT_ID: ingestion-worker-${HOSTNAME}
      MQTT_USERNAME: ${MQTT_WORKER_USER}
      MQTT_PASSWORD: ${MQTT_WORKER_PASSWORD}
      MQTT_TOPIC: sensors/+/data
      
      # S3 Archive
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      
      # Worker config
      WORKER_CONCURRENCY: "10"
      BATCH_SIZE: "100"
      FLUSH_INTERVAL: "30s"
      LOG_LEVEL: info
      
      # HTTP API
      HTTP_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - worker_data:/tmp/worker
    networks:
      - agritech-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ============================================================
  # API Server (Go)
  # ============================================================
  api-server:
    image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_API}:${IMAGE_TAG:-latest}
    container_name: agritech-api-server
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-agritech}
      DB_USER: ${DB_USER:-agritech_readonly}
      DB_PASSWORD: ${DB_READONLY_PASSWORD}
      DB_SSLMODE: require
      
      HTTP_PORT: "8081"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: info
    ports:
      - "8081:8081"
    networks:
      - agritech-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ============================================================
  # TimescaleDB (PostgreSQL + TimescaleDB extension)
  # ============================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: agritech-timescaledb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"  # Localhost only — no external access
    environment:
      POSTGRES_DB: ${DB_NAME:-agritech}
      POSTGRES_USER: ${DB_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/timescaledb.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - agritech-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPERUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ============================================================
  # Nginx — Reverse Proxy / TLS Termination
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: agritech-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api-server
      - emqx
    networks:
      - agritech-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ============================================================
  # Prometheus — Metrics Collection
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: agritech-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"  # Localhost only
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - agritech-net
    logging: *default-logging

  # ============================================================
  # Grafana — Dashboards & Visualization
  # ============================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: agritech-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # Localhost only — tunnel via SSH
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - agritech-net
    logging: *default-logging

  # ============================================================
  # Node Exporter — Host Metrics
  # ============================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: agritech-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - agritech-net
    logging: *default-logging

  # ============================================================
  # PostgreSQL Exporter — DB Metrics
  # ============================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: agritech-postgres-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-agritech_app}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-agritech}?sslmode=disable"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - agritech-net
    logging: *default-logging

networks:
  agritech-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  emqx_data:
  emqx_log:
  worker_data:
  timescaledb_data:
  prometheus_data:
  grafana_data:
  nginx_cache:
