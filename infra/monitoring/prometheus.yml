# ============================================================
# Prometheus Configuration — IoT AgriTech Monitoring
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alert Rules
rule_files:
  - "alert_rules.yml"

# Alertmanager (optional — can use Grafana alerting instead)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Scrape Targets
scrape_configs:
  # -----------------------------------------------------------
  # Prometheus self-monitoring
  # -----------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # -----------------------------------------------------------
  # Node Exporter — Host metrics (CPU, memory, disk, network)
  # -----------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'agritech-app-1'

  # -----------------------------------------------------------
  # PostgreSQL / TimescaleDB metrics
  # -----------------------------------------------------------
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          instance: 'timescaledb'

  # -----------------------------------------------------------
  # EMQX MQTT Broker metrics
  # EMQX 5.x exposes Prometheus metrics natively
  # -----------------------------------------------------------
  - job_name: 'emqx'
    metrics_path: '/api/v5/prometheus/stats'
    basic_auth:
      username: 'admin'
      password: '${EMQX_ADMIN_PASSWORD}'
    static_configs:
      - targets: ['emqx:18083']
        labels:
          instance: 'emqx-broker'
    # EMQX specific metrics
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'emqx_(.+)'
        target_label: __name__
        replacement: 'emqx_${1}'

  # -----------------------------------------------------------
  # Go Ingestion Worker — Custom metrics
  # -----------------------------------------------------------
  - job_name: 'ingestion-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ingestion-worker:8080']
        labels:
          service: 'ingestion-worker'
    # Scrape custom Go application metrics
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'agritech_(.+)'
        target_label: __name__
        replacement: 'agritech_${1}'

  # -----------------------------------------------------------
  # API Server — Custom metrics
  # -----------------------------------------------------------
  - job_name: 'api-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-server:8081']
        labels:
          service: 'api-server'

  # -----------------------------------------------------------
  # Nginx metrics (if nginx-prometheus-exporter is added)
  # -----------------------------------------------------------
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']

  # -----------------------------------------------------------
  # Blackbox Exporter — External endpoint monitoring
  # -----------------------------------------------------------
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.agritech.vn/health
          - https://mqtt.agritech.vn/mqtt
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
