# ============================================================
# Grafana Dashboard Provisioning
# ============================================================

apiVersion: 1

providers:
  - name: 'Agritech Dashboards'
    orgId: 1
    folder: 'Agritech IoT'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
